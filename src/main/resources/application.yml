server:
  port: 80
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

spring:
  application:
    name: room-booking
  profiles:
    active: '@spring.profiles.active@'
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  messages:
    encoding: UTF-8

roombooking:
  rabbitmq:
    # 1. Exchange: Topic Exchange for the entire system
    exchange: roombooking.core.exchange

    # 2. Routing Keys: Binding patterns for internal consumers
    routing-keys:
      # Priority: security-sensitive emails (OTP, password reset, etc.)
      pattern-email-priority: "notification.email.security.*"
      # Normal: all other internal notification emails
      pattern-email-normal: "notification.email.*"
      # Booking: booking lifecycle emails (create/approve/reject/cancel)
      pattern-email-booking: "notification.email.booking.*"
      # In-App: persistent notifications (Bell Icon)
      pattern-notification-in-app: "notification.in-app.*"

    # 3. Queues: Work mailboxes (Defined by consumers)
    # Pattern: <module>.<action>.queue
    queues:
      # Unified Email Fast/Slow Lanes
      email-priority: notification.send-email.priority.queue
      email-normal: notification.send-email.normal.queue
      # Booking notification mailbox (separate to avoid payload type mixing)
      email-booking: notification.send-email.booking.queue
      # Persistent in-app notifications
      notification-in-app: notification.in-app.queue
