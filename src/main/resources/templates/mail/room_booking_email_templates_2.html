
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans, Arial, sans-serif); }

  .shell { padding: 1rem 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .tab-btn {
    padding: 6px 13px; font-size: 12px; font-weight: 500; border-radius: 20px;
    border: 0.5px solid var(--color-border-secondary, #ccc);
    background: var(--color-background-primary, #fff);
    color: var(--color-text-secondary, #555);
    cursor: pointer; transition: all 0.15s;
  }
  .tab-btn:hover { background: var(--color-background-secondary, #f5f5f5); }
  .tab-btn.active {
    color: var(--color-text-primary, #111);
    border-color: var(--color-border-primary, #999);
    background: var(--color-background-secondary, #f0f0f0);
  }

  .email-frame {
    background: #f0f2f5;
    border-radius: var(--border-radius-lg, 12px);
    padding: 2rem 1rem;
    border: 0.5px solid var(--color-border-tertiary, #e0e0e0);
  }
  .email-card {
    max-width: 580px; margin: 0 auto;
    background: #ffffff;
    border-radius: 12px;
    overflow: hidden;
    font-size: 14px;
    line-height: 1.6;
    color: #2c2c2a;
    border: 0.5px solid #ddd;
  }

  .email-header {
    padding: 28px 32px 24px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  }
  .email-brand {
    font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; opacity: 0.55; color: #fff;
  }
  .email-icon-wrap {
    width: 48px; height: 48px; border-radius: 12px;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 4px;
  }
  .email-header-title {
    font-size: 20px; font-weight: 600; color: #fff; line-height: 1.3;
  }
  .email-header-sub {
    font-size: 13px; color: rgba(255,255,255,0.75); margin-top: 2px;
  }

  .email-body { padding: 28px 32px; }
  .greeting { font-size: 14px; color: #444; margin-bottom: 12px; }
  .greeting b { color: #111; }
  .intro { font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.65; }

  .info-block {
    background: #f8f9fa;
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 20px;
    border: 0.5px solid #e8e9eb;
  }
  .info-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 7px 0; border-bottom: 0.5px solid #eee; gap: 12px;
  }
  .info-row:last-child { border-bottom: none; padding-bottom: 0; }
  .info-row:first-child { padding-top: 0; }
  .info-label { font-size: 12px; color: #888; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; min-width: 90px; }
  .info-value { font-size: 13px; color: #222; font-weight: 500; text-align: right; }

  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; }

  .cta-btn {
    display: inline-block; padding: 11px 24px;
    border-radius: 8px; font-size: 13px; font-weight: 600;
    text-decoration: none; margin-top: 8px; margin-bottom: 4px;
  }

  .alert-box {
    border-radius: 8px; padding: 14px 16px;
    margin-bottom: 18px; font-size: 13px; line-height: 1.55;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .alert-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }

  .divider { border: none; border-top: 0.5px solid #eee; margin: 20px 0; }

  .footer {
    padding: 18px 32px;
    background: #fafafa;
    border-top: 0.5px solid #eee;
    text-align: center;
  }
  .footer p { font-size: 11px; color: #aaa; line-height: 1.6; }
  .footer a { color: #888; text-decoration: underline; }

  .timeline-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; }
  .tl-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .tl-content { flex: 1; }
  .tl-time { font-size: 11px; color: #aaa; font-weight: 500; text-transform: uppercase; }
  .tl-label { font-size: 13px; color: #333; font-weight: 500; }

  .slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .slot-card {
    border: 0.5px solid #e2e8f0; border-radius: 8px;
    padding: 10px 12px; background: #fff; cursor: pointer;
  }
  .slot-time { font-size: 12px; font-weight: 600; color: #334155; }
  .slot-meta { font-size: 11px; color: #94a3b8; margin-top: 2px; }

  .conflict-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0; border-bottom: 0.5px solid #eee;
  }
  .conflict-item:last-child { border-bottom: none; }
  .conflict-bar { width: 3px; border-radius: 2px; self-align: stretch; min-height: 36px; }
</style>

<div class="shell">
  <div class="tabs" id="tabBar"></div>
  <div class="email-frame">
    <div class="email-card" id="emailContent"></div>
  </div>
</div>

<script>

  {

    headerBgSolid: "#854F0B",

          <div class="conflict-bar" style="background:#185FA5;"></div>
          <div>
            <div style="font-size:13px;font-weight:600;color:#222;">Your booking <span style="font-family:monospace;font-weight:400;color:#185FA5;">#BK-20241017-055</span></div>
            <div style="font-size:12px;color:#888;margin-top:2px;">Sprint Review · 3:00 PM – 4:30 PM · 12 attendees</div>
          </div>
        </div>
        <div class="conflict-item">
          <div class="conflict-bar" style="background:#A32D2D;"></div>
          <div>
            <div style="font-size:13px;font-weight:600;color:#222;">Conflicting booking <span style="font-family:monospace;font-weight:400;color:#A32D2D;">#BK-20241017-048</span></div>
            <div style="font-size:12px;color:#888;margin-top:2px;">Design review · 3:00 PM – 4:00 PM · Alex Turner</div>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a class="cta-btn" style="background:#854F0B;color:#fff;padding:10px 18px;font-size:12px;">Reschedule my booking</a>
        <a class="cta-btn" style="background:#fff;color:#854F0B;border:0.5px solid #854F0B;padding:10px 18px;font-size:12px;">Contact admin</a>

  {
    id: "BOOKING_REMINDER",
    label: "Reminder",
    headerBgSolid: "#0F6E56",
    icon: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>`,

    subtitle: "30 minutes until your meeting",
    render: () => `
      <p class="greeting">Hello <b>Tom Reyes</b>,</p>
      <p class="intro">This is a friendly reminder that your room booking starts in <b>30 minutes</b>. Please make your way to the room on time.</p>

      </div>

let active = 0;

function renderTabs() {
  const bar = document.getElementById("tabBar");
  bar.innerHTML = TEMPLATES.map((t, i) =>
    `<button class="tab-btn${i === active ? " active" : ""}" onclick="selectTab(${i})">${t.label}</button>`
  ).join("");
}

function renderEmail() {
  const t = TEMPLATES[active];
  const card = document.getElementById("emailContent");
  card.innerHTML = `
    <div class="email-header" style="background:${t.headerBgSolid};">
      <div class="email-brand">Room Booking System</div>
      <div class="email-icon-wrap">${t.icon}</div>
      <div class="email-header-title">${t.title}</div>
      <div class="email-header-sub">${t.subtitle}</div>
    </div>
    <div class="email-body">
      ${t.render()}
    </div>
    <div class="footer">
      <p>This is an automated message from your Room Booking System.<br>
      Do not reply to this email. <a href="#">Manage notifications</a> · <a href="#">Help center</a></p>
      <p style="margin-top:6px;">© 2024 Your Company · Internal Use Only</p>
    </div>
  `;
}

function selectTab(i) {
  active = i;
  renderTabs();
  renderEmail();
}

renderTabs();
renderEmail();
</script>
