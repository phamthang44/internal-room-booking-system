# docker-compose.local.yml — for local nginx testing only
# Usage: docker compose -f docker-compose.local.yml up -d
# Then test: curl http://localhost:9090/api/...
services:
  nginx-local:
    image: nginx:stable-alpine
    container_name: room_booking_nginx_local
    ports:
      - "9090:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
