user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# --- TCP/UDP PROXY (POSTGRESQL) ---
stream {
    upstream postgres_db {
        server postgres:5432;
    }

    server {
        listen 5432;
        proxy_pass postgres_db;
        proxy_connect_timeout 1s;
        proxy_timeout 1m;
    }
}

# --- HTTP/HTTPS PROXY (WEB APP) ---
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Import your existing server logic
    server {
        listen 80;
        server_name roomhub.online api.roomhub.online;

        # Automatic redirect from HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name roomhub.online api.roomhub.online;

        # Let's Encrypt SSL Certificates
        ssl_certificate /etc/letsencrypt/live/roomhub.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/roomhub.online/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 10M;

        # ── SECURITY: Block vulnerability scanners and malicious files ──
        location ~* \.(php|env|git|bak|sql|yaml|yml|ini|config)$ {
            return 444; # Drop connection immediately
        }

        location ~* /(vendor|phpunit|eval-stdin|phpmyadmin|wp-admin|wp-includes) {
            return 444; # Drop connection immediately
        }

        # API reverse proxy
        location /api/ {
            proxy_pass http://backend-app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket support
        location /ws {
            proxy_pass http://backend-app:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}
