server {
    listen 80;
    server_name roomhub.online api.roomhub.online;

    # Automatic redirect from HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name roomhub.online api.roomhub.online;

    # Let's Encrypt SSL Certificates
    ssl_certificate /etc/letsencrypt/live/roomhub.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roomhub.online/privkey.pem;

    # Optimization for SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Allow file uploads up to 10MB
    client_max_body_size 10M;

    # API reverse proxy
    location /api/ {
        proxy_pass http://backend-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support (Important for your project)
    location /ws/ {
        proxy_pass http://backend-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}