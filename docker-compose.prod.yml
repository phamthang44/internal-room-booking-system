# Production overlay. Use --env-file .env.prod for interpolation.
name: roomhub-prod
services:
  postgres:
    container_name: !reset null
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-room_booking_db}
  rabbitmq:
    container_name: !reset null
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - room_booking_rabbitmq_data:/var/lib/rabbitmq
  redis:
    container_name: !reset null
  backend-app:
    build:
      context: .
      args:
        BUILD_PROFILE: prod
    env_file: .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-room_booking_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      FRONTEND_APP_BASE_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL}
      BACKEND_APP_BASE_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
      JWT_PRIVATE_KEY_PATH: file:/app/certs/private.pem
      JWT_PUBLIC_KEY_PATH: file:/app/certs/public.pem
    volumes:
      - type: bind
        source: ./certs
        target: /app/certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      backend-app:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  room_booking_rabbitmq_data:
